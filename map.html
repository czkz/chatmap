<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Map</title>
  <link rel="stylesheet" href="map.css">
  <link rel="shortcut icon" href="data:,">
</head>
<body>
  <dialog id="setup-dialog" closedby="none">
    <form method="dialog">
      <div>
        <label for="channel-id">Channel ID: </label>
        <input type="text" name="channel-id" id="channel-id" required />
      </div>
      <div>
        <label for="api-key">Google API key: </label>
        <input type="password" name="api-key" id="api-key" required />
      </div>
      <div>
        <input type="submit" value="Save" />
      </div>
    </form>
  </dialog>
  <div id="chart-container"></div>
  <div id="circle-cursor"></div>
  <button id="reset-button">Reset</button>
  <script>
    const cursor = document.getElementById("circle-cursor");
    document.addEventListener("mousemove", e => {
      cursor.style.left = e.clientX + "px";
      cursor.style.top = e.clientY + "px";
    }, true);
    document.addEventListener("contextmenu", e => {
      e.preventDefault();
      if (cursor.style.opacity != '0') {
        cursor.style.opacity = '0';
      } else {
        cursor.style.opacity = '1';
      }
    }, true);
  </script>
  <script type="module" src="map.js"></script>
</body>
</html>
